<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Prompt to AI Image Generator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@2.7.5/+esm"
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Canvas Prompt to AI Image Generator</h1>
            <div class="prompt-container">
                <label for="promptInput">What would you like to create?</label>
                <input type="text" id="promptInput" placeholder="Describe what you want to see in detail (e.g., A beautiful sunset on the beach with palm trees)">
            </div>
        </div>
        
        <div class="main-content">
            <div class="canvas-container">
                <h2>Drawing Canvas</h2>
                <div class="canvas-wrapper">
                    <canvas id="drawingCanvas"></canvas>
                    <div class="tools">
                        <div class="tools-section">
                            <button id="clearCanvas" class="tool-button">
                                <svg viewBox="0 0 24 24" width="18" height="18">
                                    <path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" />
                                </svg>
                                Clear
                            </button>
                            <button id="undoButton" class="tool-button">
                                <svg viewBox="0 0 24 24" width="18" height="18">
                                    <path fill="currentColor" d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z" />
                                </svg>
                                Undo
                            </button>
                        </div>
                        
                        <div class="tools-section">
                            <div class="tool-group">
                                <label for="colorInput">Color:</label>
                                <input type="color" id="colorInput" value="#000000">
                                <div class="color-presets">
                                    <div class="color-preset" data-color="#000000" style="background-color: #000000;"></div>
                                    <div class="color-preset" data-color="#FFFFFF" style="background-color: #FFFFFF;"></div>
                                    <div class="color-preset" data-color="#FF0000" style="background-color: #FF0000;"></div>
                                    <div class="color-preset" data-color="#00FF00" style="background-color: #00FF00;"></div>
                                    <div class="color-preset" data-color="#0000FF" style="background-color: #0000FF;"></div>
                                    <div class="color-preset" data-color="#FFFF00" style="background-color: #FFFF00;"></div>
                                </div>
                            </div>
                            
                            <div class="tool-group">
                                <label for="brushSize">Size:</label>
                                <input type="range" id="brushSize" min="1" max="50" value="10">
                                <span id="brushSizeDisplay">10px</span>
                            </div>
                            
                            <div class="tool-group">
                                <label for="opacityRange">Opacity:</label>
                                <input type="range" id="opacityRange" min="0.1" max="1" step="0.1" value="1">
                                <span id="opacityDisplay">100%</span>
                            </div>
                        </div>
                        
                        <div class="tools-section">
                            <div class="tool-group">
                                <label>Tool:</label>
                                <div class="tool-buttons">
                                    <button id="brushTool" class="tool-button active" data-tool="brush">
                                        <svg viewBox="0 0 24 24" width="18" height="18">
                                            <path fill="currentColor" d="M7,14A2,2 0 0,1 5,12A2,2 0 0,1 7,10A2,2 0 0,1 9,12A2,2 0 0,1 7,14M12.65,10C11.83,7.67 9.61,6 7,6A6,6 0 0,0 1,12A6,6 0 0,0 7,18C9.61,18 11.83,16.33 12.65,14H17V18H21V14H23V10H12.65Z" />
                                        </svg>
                                        Brush
                                    </button>
                                    <button id="fillTool" class="tool-button" data-tool="fill">
                                        <svg viewBox="0 0 24 24" width="18" height="18">
                                            <path fill="currentColor" d="M19,11.5C19,11.5 17,13.67 17,15A2,2 0 0,0 19,17A2,2 0 0,0 21,15C21,13.67 19,11.5 19,11.5M5.21,10L10,5.21L14.79,10M16.56,8.94L7.62,0L6.21,1.41L8.59,3.79L3.44,8.94C2.85,9.53 2.85,10.48 3.44,11.06L8.94,16.56C9.23,16.85 9.62,17 10,17C10.38,17 10.77,16.85 11.06,16.56L16.56,11.06C17.15,10.48 17.15,9.53 16.56,8.94Z" />
                                        </svg>
                                        Fill
                                    </button>
                                    <button id="eraserTool" class="tool-button" data-tool="eraser">
                                        <svg viewBox="0 0 24 24" width="18" height="18">
                                            <path fill="currentColor" d="M16.24,3.56L21.19,8.5C21.97,9.29 21.97,10.55 21.19,11.34L12,20.53C10.44,22.09 7.91,22.09 6.34,20.53L2.81,17C2.03,16.21 2.03,14.95 2.81,14.16L13.41,3.56C14.2,2.78 15.46,2.78 16.24,3.56M4.22,15.58L7.76,19.11C8.54,19.9 9.8,19.9 10.59,19.11L14.12,15.58L9.17,10.63L4.22,15.58Z" />
                                        </svg>
                                        Eraser
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="generated-image-container">
                <h2>Generated Image</h2>
                <div id="generatedImage" class="image-display">
                    <div class="placeholder">Your generated image will appear here</div>
                    <img id="aiGeneratedImage" style="display: none;">
                </div>
                <div id="imageDescription" class="description">
                    <p>Enter your prompt and draw on the canvas to guide the style of your image</p>
                </div>
                <button id="generateButton" class="generate-btn">Generate Image</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Generating your image...</p>
    </div>

    <script src="script.js" type="module"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
